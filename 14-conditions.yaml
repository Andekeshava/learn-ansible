- name: install nginx in redhat
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: install nginx in redhat
      dnf :
        name: nginx
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: install nginx on ubuntu
      apt :
        name: nginx
        state: present
      when: ansible_facts.os_family == "Debian"   