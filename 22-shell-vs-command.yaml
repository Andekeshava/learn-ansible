- name: command vs shell demo
  connection: local
  hosts: local
  become: yes
  tasks:
  - name: command vs shell modules
    #command: cat /etc/passwd/ | grep ec2-user
    shell: cat /etc/passwd | grep ec2-user
    register: ec2_user_output

  - name: command modules
    debug:
      msg: "{{ ec2_user_output }}"   

  - name: get the file
    #command: ls -la > /temp/files.txt
    shell: ls -la > /temp/files.txt
    register: files_output

  - name: print files info
    debug:
      msg: "{{ files_output }}"      