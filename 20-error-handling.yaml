- name: error-handling demo
  connection: local
  hosts: local
  become: true
  tasks:
  - name: check roboshop user exist or not 
    command: id roboshop
    register: user_output  # register is a keyword used to store the output of the id roboshop.
    ignore_errors: true   # ignore_error is the keyword used to handle know errors.

  - name: printing the user output
    debug:
      msg: "{{ user_output }}"

  - name: Create roboshop user is not exist
    command: useradd roboshop
    when: user_output.rc != 0    


