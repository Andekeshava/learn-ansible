- name: course details
  hosts: local
  connection: local
  vars:
    course: "AWS DevSecOps with AiOps"
    total_hours: 200
    tools:
    - Linux
    - AWS
    - Terraform
    - K8s
    - Docker
    - AiOps
    - Security
    live-sessions: yes
    more_details:
      trainer: Keshava Ande
      Institute: Join to Learn Skill 
      course-duration: 5
      class-duration: 1.5
  tasks:
  - name: print different types of data type is ansible
    debug:
      msg: |
        name: {{ course }}: {{ course | type_debug }}
        course_duration_in_hrs: {{ total_hours }}: {{ total_hours | type_debug }}
        Tools_Coverd: {{ tools }}: {{ tools | type_debug }}
        live-sessions: {{ live-sessions }} Live sessions only : {{ live-sessions | type_debug }}
        More_about_course: {{ more_details }}: {{ more_details | type_debug }}