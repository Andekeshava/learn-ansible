- name: conditions demo
  hosts: local
  connection: local
  vars:
    number: 10
  tasks:
  - name: print Given number is even or odd
    debug:
      msg: Given number {{ number }} is even  
    when: number % 2 == 0  

  - name: print Given number is even or odd
    debug:
      msg: Given Number {{ number }} is odd
    when: number % 2 != 0     