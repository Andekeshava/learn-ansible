- name: filters demo
  hosts: local
  connection: local
  vars:
    topics: "linux, git, jenkins, ansible, docker, k8s, terraform"
    names:
    - Ande
    - Lakshmi
    - Chenna
    - Keshava
  tasks:
  - name: print name of person
    debug:
      msg: " Hi I am {{ person | default('Keshava') }}"

  - name: coverting string to list
    debug:
      msg: "Topics are: {{ topics | split(',') }}"    

  - name: converting list to string
    debug:
      msg: "Name: {{ names | join(' ') }}"    

  - name: converting list to string and lowers case also
    debug:
      msg: "Lower: {{ names | lower }}"    